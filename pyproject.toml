
[project]
name = "fem1d-parta"
version = "0.1.0"
description = "1D Finite Element Method for the Poisson Problem"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "reportlab>=5.0.1",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fem1d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
